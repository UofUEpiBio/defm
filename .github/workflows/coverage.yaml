on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: Coverage

jobs:
  coverage:
    runs-on: ubuntu-latest
    name: Coverage

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2.9.0

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # TEMPORARY: barry (>= 0.2.2) is not on CRAN yet; pull it from
          # barryr's main branch. Remove once barry 0.2.2 is on CRAN.
          extra-packages: |
            any::covr
            USCbiostats/barryr
          needs: check

      # The package cache does not change when barryr advances its dev
      # version, so refresh it explicitly before compiling defm.
      - name: Refresh development barry
        run: |
          install.packages("remotes")
          remotes::install_github(
            "USCbiostats/barryr", dependencies = FALSE, upgrade = "never",
            force = TRUE
          )
        shell: Rscript {0}

      - name: Running coverage
        run: |
          # Run coverage
          covr::codecov(
            token = Sys.getenv("CODECOV_TOKEN")
            )
        shell: Rscript {0}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
